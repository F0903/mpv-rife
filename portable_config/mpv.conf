# Start in fullscreen mode by default.
fs=no

# For UOSC
osc=no
osd-bar=no
border=no


#
#   HWACCELL
#
vo=gpu-next
gpu-api=d3d11
d3d11-flip=yes
hwdec=auto-copy


#
#   INTERPOLATION SPECIFIC SETTINGS
#
vf=vapoursynth="C:\Program Files\mpv\portable_config\rife.vpy":buffered-frames=4:concurrent-frames=32
hr-seek-framedrop=no
video-sync=audio # Some prefer having this set to display-resample


#
#   AUDIO
#
audio-exclusive=no # Enable this if you only want audio from mpv.


#
#   COLOR SETTINGS
#
target-colorspace-hint=yes
target-prim=auto # Set to your display primaries or auto
target-trc=auto # Set to your display gamma or auto
video-output-levels=full
target-peak=auto # Adjust to display peak HDR brightness.
allow-delayed-peak-detect=no
tone-mapping=auto


#
#   SCALING
#
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
deband=yes

#
#   PROFILES
#
[no-rife]
vf-clr
